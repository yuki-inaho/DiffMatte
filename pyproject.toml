[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffmatte-exporter"
version = "0.1.0"
description = "Detectron2-free DiffMatte checkpoint to ONNX exporter"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "einops>=0.7,<1",
  "numpy>=1.26,<2",
  "omegaconf>=2.3,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10,<13",
  "torch>=2.7,<2.8",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
export = [
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "onnxscript>=0.2,<1",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
diffmatte-export-onnx = "diffmatte_onnx.export:main"
diffmatte-validate-onnx = "diffmatte_onnx.validate:main"

[tool.setuptools.packages.find]
include = ["diffmatte_onnx*", "modeling*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
